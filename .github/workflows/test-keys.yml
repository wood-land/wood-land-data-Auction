name: API 키 테스트

# 카카오/브이월드 Secrets가 정상 등록돼 읽히는지 확인하는 1회성 수동 워크플로우.
# 키 값은 로그에 출력하지 않고, 길이와 API 응답 결과만 출력한다.
on:
  workflow_dispatch:

jobs:
  test-keys:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: requests 설치
        run: pip install requests

      - name: 키 테스트
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          VWORLD_API_KEY: ${{ secrets.VWORLD_API_KEY }}
        run: |
          python - <<'PY'
          import os, sys, requests

          kakao = os.environ.get("KAKAO_REST_API_KEY", "")
          vworld = os.environ.get("VWORLD_API_KEY", "")
          print(f"KAKAO_REST_API_KEY 길이: {len(kakao)} / VWORLD_API_KEY 길이: {len(vworld)}")
          ok = True

          if kakao != kakao.strip() or kakao.lower().startswith("kakaoak"):
              print("[경고] 카카오 키에 공백/줄바꿈이 있거나 'KakaoAK ' 접두어가 들어있습니다.")
              ok = False

          pnu = None
          try:
              r = requests.get(
                  "https://dapi.kakao.com/v2/local/search/address.json",
                  headers={"Authorization": f"KakaoAK {kakao.strip()}"},
                  params={"query": "서울특별시 중구 태평로1가 31"}, timeout=10)
              print(f"[카카오] HTTP {r.status_code}")
              if r.status_code == 200 and r.json().get("documents"):
                  a = r.json()["documents"][0]["address"]
                  pnu = f"{a['b_code'][:10]}1{int(a['main_address_no']):04d}{int(a['sub_address_no'] or 0):04d}"
                  print(f"[카카오] 성공 - 주소: {a['address_name']} / PNU: {pnu}")
              else:
                  print(f"[카카오] 실패 - 응답: {r.text[:200]}")
                  ok = False
          except Exception as e:
              print(f"[카카오] 오류: {e}")
              ok = False

          import time
          ua = {"User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124.0 Safari/537.36"}
          tests = [
              ("토지이용(ned)", "https://api.vworld.kr/ned/data/getLandUseAttr",
               {"key": vworld.strip(), "pnu": pnu or "1114010300100310000", "format": "xml", "numOfRows": 5}),
              ("연속지적(req/data)", "https://api.vworld.kr/req/data",
               {"service": "data", "request": "GetFeature", "data": "LP_PA_CBND_BUBUN",
                "key": vworld.strip(), "attrFilter": f"pnu:=:{pnu or '1114010300100310000'}", "format": "json"}),
          ]
          vw_ok = False
          for name, url, params in tests:
              for attempt in range(1, 4):
                  try:
                      r = requests.get(url, params=params, headers=ua, timeout=20)
                      print(f"[브이월드/{name}] 시도{attempt} HTTP {r.status_code} / 응답 {len(r.text)}자 / {r.text[:150]!r}")
                      if r.status_code == 200 and ("<field>" in r.text or '"OK"' in r.text):
                          vw_ok = True
                          break
                  except Exception as e:
                      print(f"[브이월드/{name}] 시도{attempt} 오류: {e}")
                  time.sleep(2)
          if not vw_ok:
              ok = False

          print("결과:", "모두 정상" if ok else "문제 있음")
          sys.exit(0 if ok else 1)
          PY
