name: factory-weekly

# 공장/근린상가 진행물건 수집(+ NPL 겹침 열). 매주 일요일 18:00(KST)에 자동 실행하고, 수동 실행(workflow_dispatch)도 가능하다.
# - 자동(schedule) 실행은 입력값이 없으므로 아래 기본값(최저가 상한 10억 / 건물면적 상한 200평)으로 돈다.
# - 수동 실행(Actions 탭 > factory-weekly > Run workflow)에서만 값을 바꿔 넣을 수 있다.
# - auction-weekly(금·토 새벽)와 시각이 겹치지 않고, 같은 concurrency 그룹이라 겹치더라도 순서대로 실행된다.
on:
  schedule:
    # 일요일 18:00 KST = 일요일 09:00 UTC
    - cron: "0 9 * * 0"
  workflow_dispatch:
    inputs:
      minb_amt_end:
        description: "최저가격 상한 (원 단위, 사이트 옵션 값. 예: 1000000000 = 10억)"
        required: false
        default: "1000000000"
      area_pyeong_end:
        description: "건물면적 상한 (평)"
        required: false
        default: "200"
      test_max_items:
        description: "테스트용: 물건종류마다 경매 신규 N건만 수집(공매 생략, 이전 탭 삭제 안 함). 0 이면 전체 수집"
        required: false
        default: "0"

jobs:
  crawl:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auction
    timeout-minutes: 300
    concurrency:
      # auction-weekly 와 같은 그룹: 같은 사이트에 로그인 세션이 동시에 둘 열리지 않도록 순서대로 실행한다.
      group: weekly-data-collection
      cancel-in-progress: false

    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 브라우저 설치
        uses: browser-actions/setup-chrome@v1

      - name: 필수 설정 확인
        env:
          NPL_SHEET_ID: ${{ secrets.NPL_SHEET_ID }}
        run: |
          if [ -z "$NPL_SHEET_ID" ]; then
            echo "::error::Secrets 에 NPL_SHEET_ID 가 없습니다 (결과를 저장할 시트 ID)."
            exit 1
          fi

      - name: 실행
        env:
          SITE_DOMAIN: ${{ secrets.SITE_DOMAIN }}
          SITE_LOGIN_ID: ${{ secrets.SITE_LOGIN_ID }}
          SITE_LOGIN_PW: ${{ secrets.SITE_LOGIN_PW }}
          TYPE_A_LABEL: ${{ secrets.TYPE_A_LABEL }}
          TYPE_B_LABEL: ${{ secrets.TYPE_B_LABEL }}
          # NPL 목록이 있는 스프레드시트 ID. 공장/근린상가 결과 탭도 이 시트에 저장한다.
          # 서비스 계정(GOOGLE_SA_KEY_JSON_ADMIN)이 그 시트에 '편집자'로 공유되어 있어야 한다.
          NPL_SHEET_ID: ${{ secrets.NPL_SHEET_ID }}
          SHARE_EMAIL: ${{ secrets.SHARE_EMAIL }}
          GOOGLE_SA_KEY_JSON: ${{ secrets.GOOGLE_SA_KEY_JSON_ADMIN }}
          MINB_AMT_END: ${{ github.event.inputs.minb_amt_end || '1000000000' }}
          AREA_PYEONG_END: ${{ github.event.inputs.area_pyeong_end || '200' }}
          TEST_MAX_NEW_ITEMS: ${{ github.event.inputs.test_max_items || '0' }}
        run: python factory_crawler.py
