name: news-crawl

on:
  schedule:
    - cron: "0 21 * * *"   # 매일 06:00 KST (UTC 21:00) - 하루에 한 곳씩, 7일에 한 바퀴
  workflow_dispatch:
    inputs:
      region:
        description: "단위(쉼표 구분: 강원,충청:충남,충청:충북,전라:전북,전라:광주전남,경남:1/2,경남:2/2,경북:1/2,경북:2/2). 비우면 전체를 하나씩 순서대로"
        required: false
        default: ""
      days:
        description: "최근 N일 (비우면 20일. 예약 실행은 지역당 7일에 한 번이라 20일이면 13일 겹쳐 놓친 기사를 다시 잡는다. 시험은 365)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: news-crawl
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      regions: ${{ steps.pick.outputs.regions }}
    steps:
      - id: pick
        env:
          INPUT_REGIONS: ${{ github.event.inputs.region }}
          EVENT: ${{ github.event_name }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, datetime
          # 7일에 한 바퀴: 하루에 한 곳씩 돈다(경기는 제외). 큰 지역은 같은 날 두 번으로 나눠 돈다(작업마다 제한 시간이 따로 있음).
          # 단위 표기: "지역" / "지역:이름"(PART_GROUPS 의 묶음) / "지역:N/M"(활성 신문사를 M개로 번갈아 나눈 N번째)
          DAYS = [
              ["강원"],
              ["충청:충남"],
              ["충청:충북"],
              ["전라:전북"],
              ["전라:광주전남"],
              ["경남:1/2", "경남:2/2"],
              ["경북:1/2", "경북:2/2"],
          ]
          ALL = [u for d in DAYS for u in d]
          inp = [x for x in os.environ.get("INPUT_REGIONS", "").replace(" ", "").split(",") if x]
          if inp:                                  # 수동 실행 + 지정: 그대로 (예: 충청:충남,강원)
              pick = inp
          elif os.environ["EVENT"] == "workflow_dispatch":   # 수동 실행 + 비움: 전체
              pick = ALL
          else:                                    # 예약: 오늘 차례
              pick = DAYS[datetime.date.today().toordinal() % len(DAYS)]
          print("regions=" + json.dumps(pick, ensure_ascii=False))
          PY

  crawl:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 200
    strategy:
      fail-fast: false
      max-parallel: 1        # 결과 DB(news_articles_pnu.db)가 파일 하나라 동시에 push 하면 충돌한다. 한 지역씩 순서대로 돈다.
      matrix:
        region: ${{ fromJSON(needs.plan.outputs.regions) }}
    defaults:
      run:
        working-directory: news
    env:
      NEWS_SAVE_DIR: ${{ github.workspace }}/db/news
      KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
      VWORLD_API_KEY: ${{ secrets.VWORLD_API_KEY }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - name: Checkout private DB repo -> db/
        uses: actions/checkout@v4
        with:
          repository: wood-land/wood-land-data-db
          token: ${{ secrets.DATA_DB_TOKEN }}
          path: db

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: news/requirements.txt

      - uses: browser-actions/setup-chrome@v1

      - run: pip install -r requirements.txt

      - name: Crawl + PNU (${{ matrix.region }})
        env:
          UNIT: ${{ matrix.region }}
          NEWS_UNIT: ${{ matrix.region }}
          DAYS: ${{ github.event.inputs.days }}
          # 수집 통계를 gosi 와 같은 구글시트의 news_실행기록 / news_신문사별 탭에 남긴다(기사 본문·주소는 보내지 않음)
          GOOGLE_SHEET_ID: ${{ secrets.GOSI_GOOGLE_SHEET_ID }}
          GOOGLE_CREDENTIALS_EDITER: ${{ secrets.GOOGLE_CREDENTIALS_EDITER }}
        run: |
          REGION="${UNIT%%:*}"; PART=""
          case "$UNIT" in *:*) PART="--part ${UNIT#*:}";; esac
          # 시간 예산: 작업 제한(timeout-minutes 200)에 걸려 취소되면 PNU 단계가 못 돌아 그날 결과가 통째로 사라진다.
          # 170분이 지나면 수집을 멈추고 지금까지의 결과로 정제·PNU·커밋 단계를 진행한다.
          python run_crawl.py "$REGION" $PART --days "${DAYS:-20}" --headless --pnu --time-budget-min 170

      # 시간 초과·오류로 파이썬이 끝까지 못 돌았으면 실행기록에 실패 1줄만 남긴다.
      - name: Log failure to Google Sheet
        if: failure() || cancelled()
        env:
          UNIT: ${{ matrix.region }}
          GOOGLE_SHEET_ID: ${{ secrets.GOSI_GOOGLE_SHEET_ID }}
          GOOGLE_CREDENTIALS_EDITER: ${{ secrets.GOOGLE_CREDENTIALS_EDITER }}
          STATUS: ${{ job.status }}
        run: python common/run_log.py --unit "$UNIT" --status "실패/중단($STATUS)"

      # 지역마다 바로 반영한다. 한 지역이 시간 초과로 끊겨도 이미 끝난 지역의 결과는 남는다(if: always()).
      - name: Commit PNU DB to private repo (기사 본문 CSV 는 커밋하지 않음)
        if: always()
        working-directory: db
        env:
          UNIT: ${{ matrix.region }}
        run: |
          REGION="$(echo "$UNIT" | tr '/' '-')"   # 경북:1/2 -> 경북:1-2 (커밋 메시지용)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news/news_articles_pnu.db
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "news: ${REGION} PNU DB 갱신 $(date -u +%F)"
          for i in 1 2 3 4 5 6; do
            git pull --rebase origin main && git push && exit 0
            sleep $((RANDOM % 10 + 5))
          done
          echo "::error::push 실패"; exit 1
