name: news-crawl

on:
  schedule:
    - cron: "0 21 * * *"   # 매일 06:00 KST (UTC 21:00) - 하루에 2개 지역씩, 6개 지역이 3일에 한 바퀴
  workflow_dispatch:
    inputs:
      region:
        description: "단위(쉼표 구분: 강원,경기,전라,충청,경북:1/2,경북:2/2,경남:1/2,경남:2/2). 비우면 전체를 하나씩 순서대로"
        required: false
        default: ""
      days:
        description: "최근 N일 (비우면 4일. 예약 실행은 지역당 3일에 한 번이라 4일로 1일 겹친다. 처음 채울 때만 15~30)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: news-crawl
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      regions: ${{ steps.pick.outputs.regions }}
    steps:
      - id: pick
        env:
          INPUT_REGIONS: ${{ github.event.inputs.region }}
          EVENT: ${{ github.event_name }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, datetime
          # 8개 단위(큰 지역 경북·경남은 둘로 나눔)를 3개 조로 묶어 하루에 한 조씩 돈다. 8개 단위가 3일에 한 바퀴.
          # 단위 표기: "지역" 또는 "지역:N/M" (그 지역 활성 신문사를 M개로 나눈 N번째)
          GROUPS = [["충청", "강원"], ["경북:1/2", "경남:1/2", "전라"], ["경북:2/2", "경남:2/2", "경기"]]
          ALL = [r for g in GROUPS for r in g]
          inp = [x for x in os.environ.get("INPUT_REGIONS", "").replace(" ", "").split(",") if x]
          if inp:                                  # 수동 실행 + 지정: 그대로 (예: 경북:1/2,강원)
              pick = inp
          elif os.environ["EVENT"] == "workflow_dispatch":   # 수동 실행 + 비움: 전체
              pick = ALL
          else:                                    # 예약: 오늘 차례의 조
              pick = GROUPS[datetime.date.today().toordinal() % 3]
          print("regions=" + json.dumps(pick, ensure_ascii=False))
          PY

  crawl:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 170
    strategy:
      fail-fast: false
      max-parallel: 1        # 결과 DB(news_articles_pnu.db)가 파일 하나라 동시에 push 하면 충돌한다. 한 지역씩 순서대로 돈다.
      matrix:
        region: ${{ fromJSON(needs.plan.outputs.regions) }}
    defaults:
      run:
        working-directory: news
    env:
      NEWS_SAVE_DIR: ${{ github.workspace }}/db/news
      KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
      VWORLD_API_KEY: ${{ secrets.VWORLD_API_KEY }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - name: Checkout private DB repo -> db/
        uses: actions/checkout@v4
        with:
          repository: wood-land/wood-land-data-db
          token: ${{ secrets.DATA_DB_TOKEN }}
          path: db

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: news/requirements.txt

      - uses: browser-actions/setup-chrome@v1

      - run: pip install -r requirements.txt

      - name: Crawl + PNU (${{ matrix.region }})
        env:
          UNIT: ${{ matrix.region }}
          DAYS: ${{ github.event.inputs.days }}
        run: |
          REGION="${UNIT%%:*}"; PART=""
          case "$UNIT" in *:*) PART="--part ${UNIT#*:}";; esac
          python run_crawl.py "$REGION" $PART --days "${DAYS:-4}" --headless --pnu

      # 지역마다 바로 반영한다. 한 지역이 시간 초과로 끊겨도 이미 끝난 지역의 결과는 남는다(if: always()).
      - name: Commit PNU DB to private repo (기사 본문 CSV 는 커밋하지 않음)
        if: always()
        working-directory: db
        env:
          UNIT: ${{ matrix.region }}
        run: |
          REGION="$(echo "$UNIT" | tr '/' '-')"   # 경북:1/2 -> 경북:1-2 (커밋 메시지용)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news/news_articles_pnu.db
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "news: ${REGION} PNU DB 갱신 $(date -u +%F)"
          for i in 1 2 3 4 5 6; do
            git pull --rebase origin main && git push && exit 0
            sleep $((RANDOM % 10 + 5))
          done
          echo "::error::push 실패"; exit 1
