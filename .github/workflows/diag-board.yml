name: diag-board

# 게시판 한 곳을 GitHub Actions 러너(실제 수집이 도는 환경)에서 열어 구조를 진단한다. 읽기 전용: 저장소·DB 에 아무것도 쓰지 않고 시크릿도 쓰지 않는다.
# 쓰는 때: 공보 파서가 '목록 못 읽음'(JS 화면/구조 다름)인 게시판, 목록 URL 을 찾아야 하는 게시판(예: 부산광역시청 시보, 인천광역시청 시보)처럼
# 한국 IP·러너에서만 열려 클라우드 개발 환경에서는 구조를 볼 수 없는 사이트를 확인할 때. 결과는 실행 로그와 artifact(diag-board, 7일 보관)에 남는다.
# 대상은 *.go.kr 만 허용한다(gosi/diag_fetch.py, law.md 6절).

on:
  push:   # 임시(병합 전 검증용, 검증 후 제거): 이 브랜치에 푸시하면 기본 주소로 한 번 실행한다
    branches: [claude/diag-board-workflow]
  workflow_dispatch:
    inputs:
      url:
        description: "진단할 게시판 주소 (*.go.kr). 예: https://www.busan.go.kr/news/index"
        required: true

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: gosi
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: gosi/requirements.txt

      - run: pip install -r requirements.txt

      - name: Diagnose
        env:
          DIAG_URL: ${{ github.event.inputs.url || 'https://www.busan.go.kr/nbgosi' }}   # 셸에 직접 끼워 넣지 않고 환경변수로만 넘긴다
        run: python diag_fetch.py "$DIAG_URL" --out diag_out

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag-board
          path: gosi/diag_out
          retention-days: 7
          if-no-files-found: ignore
