name: npl-weekly

# 옥션원 NPL 목록(감정가 2억~15억) -> 구글시트 'NPL_YYYYMMDD' + 'NPL_로그_목록'
# 코드: npl/list_npl_sheet.py (로컬판: 200_MU-MU_Auction 의 500_local/52. 경공매 추출/03_3)
# 저장 시트: 코드 안 NPL_SHEET_ID (10vK5WyeAV...). 서비스 계정에 편집자로 공유돼 있어야 한다.
# Secrets: A1_LOGIN_ID, A1_LOGIN_PW (옥션원), GOOGLE_SA_KEY_JSON_ADMIN (서비스 계정 키)
# 주의: 옥션원이 GitHub 서버 IP를 403 으로 막은 적이 있다. 로그인 단계에서 실패하면 그 문제다.

on:
  schedule:
    - cron: "0 13 * * 4"   # 매주 목요일 22:00 KST (= 목 13:00 UTC)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npl:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: npl

    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 패키지 설치
        run: pip install requests beautifulsoup4 lxml openpyxl gspread google-auth

      - name: 구글 키 파일 만들기
        env:
          GOOGLE_SA_KEY_JSON: ${{ secrets.GOOGLE_SA_KEY_JSON_ADMIN }}
        run: |
          printf '%s' "$GOOGLE_SA_KEY_JSON" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_CREDENTIALS_PATH=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: 실행
        env:
          PYTHONUTF8: "1"
          A1_LOGIN_ID: ${{ secrets.A1_LOGIN_ID }}
          A1_LOGIN_PW: ${{ secrets.A1_LOGIN_PW }}
        run: python list_npl_sheet.py
