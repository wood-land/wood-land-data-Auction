name: diag-notice

# 공보 글 한 건의 공고 본문 텍스트와 추출 결과를 Actions 러너에서 보여 준다. 읽기 전용: 저장소·DB 에 아무것도 쓰지 않고 시크릿도 쓰지 않는다.
# 쓰는 때: 소재지가 잘못 읽힌 공고(예: 인천광역시 시보의 '기정면 주안동리')를 고치려고 규칙에 들어간 실제 텍스트를 봐야 할 때.
# 실제 수집(collect-gosigongo)과 같은 첨부 읽기(미리보기·OCR)를 쓰므로 수 분이 걸릴 수 있다. 결과는 실행 로그와 artifact(diag-notice, 7일 보관).
# 대상은 *.go.kr 만 허용한다(gosi/diag_notice.py -> diag_fetch.host_allowed, law.md 6절).

on:
  push:   # 임시(병합 전 검증용, 검증 후 제거): 이 브랜치에 푸시하면 시보 제2489호(주안동)로 한 번 실행한다
    branches: [claude/diag-notice-and-wide-region]
  workflow_dispatch:
    inputs:
      board_url:
        description: "게시판 목록 주소 (*.go.kr). 예: https://www.incheon.go.kr/IC010303"
        required: true
      post_id:
        description: "글 주소에 들어 있는 번호. 예: 3092904 (https://www.incheon.go.kr/IC010303/3092904)"
        required: true
      grep:
        description: "이 정규식이 든 공고 본문만 보여 준다. 예: 주안동"
        required: false
        default: ""
      days:
        description: "목록에서 글을 찾는 기간(일)"
        required: false
        default: "60"
      module:
        description: "공보 엑셀 권역(파일) 이름"
        required: false
        default: "인천"
      city:
        description: "공보 엑셀 지자체 이름"
        required: false
        default: "인천광역시청"
      kind:
        description: "종류"
        required: false
        default: "시보"

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: gosi
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: gosi/requirements.txt

      # 스캔 PDF OCR 용. 실제 수집과 같은 조건으로 읽으려고 설치하되, 실패해도 계속한다(미리보기·텍스트 PDF 는 필요 없음).
      - name: Install tesseract (OCR, kor)
        timeout-minutes: 10
        continue-on-error: true
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y tesseract-ocr tesseract-ocr-kor

      - run: pip install -r requirements.txt

      - name: Diagnose notice
        env:   # 입력은 셸에 직접 끼워 넣지 않고 환경변수로만 넘긴다
          BOARD_URL: ${{ github.event.inputs.board_url || 'https://www.incheon.go.kr/IC010303' }}
          POST_ID: ${{ github.event.inputs.post_id || '3092904' }}
          GREP: ${{ github.event.inputs.grep || '주안동' }}
          DAYS: ${{ github.event.inputs.days || '60' }}
          MODULE: ${{ github.event.inputs.module || '인천' }}
          CITY: ${{ github.event.inputs.city || '인천광역시청' }}
          KIND: ${{ github.event.inputs.kind || '시보' }}
          PYTHONIOENCODING: utf-8
        run: python diag_notice.py --board-url "$BOARD_URL" --post-id "$POST_ID" --grep "$GREP" --days "$DAYS" --module "$MODULE" --city "$CITY" --kind "$KIND" --out diag_out

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag-notice
          path: gosi/diag_out
          retention-days: 7
          if-no-files-found: ignore
