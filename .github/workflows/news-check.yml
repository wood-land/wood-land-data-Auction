name: news-check

# 지역의 신문사를 하나씩 시험 검색해 정상 여부를 점검한다(저장·DB 반영 없음). 실행 환경(GitHub 서버)에서 막히는 신문사를 찾는 용도.
on:
  workflow_dispatch:
    inputs:
      region:
        description: "지역 (강원, 경기, 전라, 충청, 경북, 경남)"
        required: true
        default: "경북"
      keyword:
        description: "시험 검색어 1개"
        required: false
        default: "보상"
      paper:
        description: "특정 신문사만 (비우면 전체)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: news
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: news/requirements.txt
      - uses: browser-actions/setup-chrome@v1
      - run: pip install -r requirements.txt
      - name: 신문사별 시험 검색
        env:
          REGION: ${{ github.event.inputs.region }}
          KEYWORD: ${{ github.event.inputs.keyword }}
          PAPER: ${{ github.event.inputs.paper }}
        run: |
          ARGS=""
          [ -n "$PAPER" ] && ARGS="--paper $PAPER"
          python check_region.py "$REGION" --keyword "${KEYWORD:-보상}" $ARGS
